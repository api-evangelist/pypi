apis:
- aid: pypi:index
  name: PyPI Index API
  description: >-
    The PyPI Index API implements the PEP 503 (HTML) and PEP 691 (JSON) simple repository standards for
    discovering and downloading Python packages. It provides a machine-readable index of all registered
    projects and their available distribution files. The API is available in both HTML and JSON formats,
    with JSON recommended for new integrations. This is the primary API that package installers like pip
    use to resolve and download dependencies from the Python Package Index.
  humanURL: https://docs.pypi.org/api/index-api/
  tags:
  - Index
  - Packages
  - PEP 503
  - PEP 691
  - Python
  properties:
  - type: Documentation
    url: https://docs.pypi.org/api/index-api/
  - type: OpenAPI
    url: openapi/pypi-index-api-openapi.yml
- aid: pypi:upload
  name: PyPI Upload API
  description: >-
    The PyPI Upload API is the endpoint used by tools like twine and build frontends to publish Python
    package distributions to the Python Package Index. Served at upload.pypi.org, it emulates the legacy
    PyPI upload interface and accepts source distributions and wheel files along with their metadata.
    The API also supports attaching PEP 740 digital attestations to uploads, which PyPI will verify before
    accepting. Authentication is handled via API tokens or Trusted Publishing workflows using OpenID Connect.
  humanURL: https://docs.pypi.org/api/upload/
  tags:
  - Packages
  - Publishing
  - Python
  - Upload
  properties:
  - type: Documentation
    url: https://docs.pypi.org/api/upload/
  - type: OpenAPI
    url: openapi/pypi-upload-api-openapi.yml
- aid: pypi:feeds
  name: PyPI RSS Feeds
  description: >-
    PyPI provides RSS feeds that allow developers and tools to monitor package activity on the Python
    Package Index. Three feeds are available: the Newest Packages feed for recently registered projects,
    the Latest Updates feed for the most recently updated projects, and per-project release feeds for
    tracking new versions of specific packages. These feeds enable integration with feed readers, monitoring
    tools, and automation workflows to stay informed about Python package ecosystem changes.
  humanURL: https://docs.pypi.org/api/feeds/
  tags:
  - Feeds
  - Packages
  - Python
  - RSS
  - Updates
  properties:
  - type: Documentation
    url: https://docs.pypi.org/api/feeds/
