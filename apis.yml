apis:
- aid: pypi:feeds
  name: PyPI RSS Feeds
  description: >-
    PyPI provides RSS feeds that allow developers and tools to monitor package activity on the Python
    Package Index. Three feeds are available: the Newest Packages feed for recently registered projects,
    the Latest Updates feed for the most recently updated projects, and per-project release feeds for
    tracking new versions of specific packages. These feeds enable integration with feed readers, monitoring
    tools, and automation workflows to stay informed about Python package ecosystem changes.
  humanURL: https://docs.pypi.org/api/feeds/
  tags:
  - Feeds
  - Packages
  - Python
  - RSS
  - Updates
  properties:
  - type: Documentation
    url: https://docs.pypi.org/api/feeds/
