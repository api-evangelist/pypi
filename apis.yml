aid: pypi
name: PyPI
description: >-
  PyPI (Python Package Index) is the official third-party software repository for Python, serving as the central hub
  where developers publish and distribute Python packages. Their developer platform provides a suite of APIs for
  querying package metadata, downloading distributions, publishing packages, verifying supply chain integrity, and
  tracking download statistics across the Python ecosystem.
