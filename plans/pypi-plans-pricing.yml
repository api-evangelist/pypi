description: PyPI (the Python Package Index) is the public, free package registry for the Python language,
  operated by the Python Software Foundation / Python Packaging Authority. There are no commercial pricing
  tiers, no paid plans, and no chargeable surface — usage is donation-supported.
sources:
  - https://pypi.org/help/
  - https://docs.pypi.org/api/
plans:
  - id: pypi-public
    name: Public Index
    type: freemium
    description: Free, publicly accessible package index and metadata API. PyPI is heavily cached and
      distributed via Fastly's CDN. No account is required for read access; uploads require a free
      account and 2FA.
