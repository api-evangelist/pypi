description: FOCUS-aligned FinOps shape for PyPI. PyPI is operated by the Python Software Foundation
  as donation-supported public infrastructure — there is no vendor invoice, no metered API, and no
  commercial tier. Consumer-side cost is purely the consumer's own infrastructure (egress, CI runner
  time, mirror storage).
notes: PyPI does not bill consumers. The only FinOps-relevant cost is the consumer's own bandwidth /
  CI / mirror infrastructure. Donations to the PSF are voluntary.
