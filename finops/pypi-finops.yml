principles:
  - name: Visibility
    description: PyPI publishes BigQuery / Google Cloud Storage download statistics (`bigquery-public-data.pypi.file_downloads`)
      so consumers and maintainers can see download patterns; consumer cost is observable in the consumer's
      own cloud / CI bill.
  - name: Allocation
    description: Allocate consumer-side cost (egress, CI runtime, mirror storage) by team or product
      using the consumer's own tagging; PyPI itself has no per-consumer billing surface.
  - name: Optimization
    description: Use Fastly's CDN cache headers and ETag conditional requests, pin and cache wheels
      in a private mirror (devpi, Artifactory, Nexus) to reduce repeat egress, and use lockfiles to
      avoid unnecessary metadata churn.
  - name: Accountability
    description: PyPI has no consumer-side budget owner; the PSF funds operation via donations. Consumer
      organizations should account for their own mirror and CI cost.
